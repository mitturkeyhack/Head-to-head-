name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#141B47' --splashBackgroundColor '#141B47'
          npx cap sync android

      - name: Ekranı dikey sabitle
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: APK derle
        working-directory: android
        run: |
          mkdir -p ~/.android && cp ../ci/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KafaKafaya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KafaKafaya-apk
          path: KafaKafaya.apk

      - name: Sürüm sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Kafa Kafaya (son sürüm)
          body: "Telefonuna kurmak için aşağıdaki KafaKafaya.apk dosyasını indir."
          files: KafaKafaya.apk
          make_latest: true
