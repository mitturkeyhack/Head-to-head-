name: APK Derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: APK derle
        run: |
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SesliAsistan.apk
      - uses: actions/upload-artifact@v4
        with: { name: SesliAsistan-apk, path: SesliAsistan.apk }
      - name: Sürüm sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sesli-asistan
          name: Sesli Asistan (son sürüm)
          body: "Telefonuna kurmak için aşağıdaki SesliAsistan.apk dosyasını indir."
          files: SesliAsistan.apk
          make_latest: true
